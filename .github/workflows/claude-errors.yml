name: Recent Claude errors

# Prints the server's recent Claude API errors (status and Anthropic's message only), to tell a spending or
# credit limit from an outage. Read-only. Runs from the Actions tab, or when this file changes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/claude-errors.yml"

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP_NAME }}
    steps:
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Claude errors in the server log
        run: |
          flyctl logs --app "$APP" --no-tail 2>&1 | grep -E "Claude (API|client) error" | sed -E 's#https?://[^ ]+#<link>#g' | tail -30 || true
