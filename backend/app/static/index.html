<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Travel Edit</title>
  <meta name="description" content="Turn TikTok and Instagram travel reels into a map and an itinerary.">
  <meta name="theme-color" content="#F1EBE2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15100C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Travel Edit">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="preload" href="/vendor/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/cormorant/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="view" aria-live="polite"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <span class="tab-lens" aria-hidden="true"></span>
    <a class="tab" href="#/" data-tab="home"><span data-icon="home"></span>Home</a>
    <a class="tab" href="#/library" data-tab="trips"><span data-icon="bookmark"></span>Library</a>
    <a class="tab" href="#/discover" data-tab="discover"><span data-icon="compass"></span>Discover</a>
    <a class="tab" href="#/bookings" data-tab="bookings"><span data-icon="bookings"></span>Bookings</a>
    <a class="tab" href="#/concierge" data-tab="concierge"><span data-icon="concierge"></span>Concierge</a>
  </nav>
  <div id="netpill" class="netpill" role="status" hidden><span data-icon="offline"></span>Offline · showing what’s saved on this phone</div>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>The Travel Edit needs JavaScript turned on.</noscript>
</body>
</html>
