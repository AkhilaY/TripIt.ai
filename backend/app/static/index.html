<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TripIt</title>
  <meta name="description" content="Turn TikTok and Instagram travel reels into a map and an itinerary.">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TripIt">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="view" aria-live="polite"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a class="tab" href="#/" data-tab="trips"><span data-icon="trips"></span>Trips</a>
    <a class="tab" href="#/map" data-tab="map"><span data-icon="map"></span>Map</a>
    <a class="tab" href="#/imports" data-tab="imports"><span data-icon="tray"></span>Imports</a>
    <a class="tab" href="#/settings" data-tab="settings"><span data-icon="gear"></span>Settings</a>
  </nav>
  <div id="overlay"></div>
  <noscript>TripIt needs JavaScript turned on.</noscript>
</body>
</html>
