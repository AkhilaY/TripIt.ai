name: TripIt
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(TRIPIT_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.$(TRIPIT_BUNDLE_ID)

targets:
  TripIt:
    type: application
    platform: iOS
    sources:
      - TripIt
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRIPIT_BUNDLE_ID)
        PRODUCT_NAME: TripIt
        INFOPLIST_FILE: TripIt/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripIt/TripIt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TripItShare
        embed: true
    scheme: {}

  TripItShare:
    type: app-extension
    platform: iOS
    sources:
      - TripItShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRIPIT_BUNDLE_ID).share
        PRODUCT_NAME: TripItShare
        INFOPLIST_FILE: TripItShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripItShare/TripItShare.entitlements
